name: Rebuild guide pages

# Edits made in the browser only change guide-content/*.json, so the HTML is
# regenerated here and committed back, which republishes GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "guide-content/**"
      - "data/**"
      - "build_site.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-guides

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: python build_site.py

      - name: Commit rebuilt pages
        run: |
          git config user.name "dpm-guides-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html guides site-guides.json assets/styles.css assets/site.js
          if git diff --cached --quiet; then
            echo "Pages already up to date."
          else
            git commit -m "Rebuild guide pages after content edit"
            git push
          fi
